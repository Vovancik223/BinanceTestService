databaseChangeLog:
  - changeSet:
      id: 001-create-price-records
      author: developer
      changes:
        - createTable:
            tableName: price_records
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_price_records
                    nullable: false

              - column:
                  name: symbol
                  type: VARCHAR(20)
                  constraints:
                    nullable: false

              - column:
                  name: price
                  type: NUMERIC(30, 15)
                  constraints:
                    nullable: false

              - column:
                  name: fetched_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

        - createIndex:
            tableName: price_records
            indexName: idx_price_records_symbol_fetched_at
            columns:
              - column:
                  name: symbol
              - column:
                  name: fetched_at