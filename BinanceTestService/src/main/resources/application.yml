spring:
  application:
    name: binance-price-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/binance_prices}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  task:
    scheduling:
      pool:
        size: 1

server:
  port: ${SERVER_PORT:8080}

binance:
  base-url: ${BINANCE_BASE_URL:https://api.binance.com}
  symbol: ${BINANCE_SYMBOL:BNBUSDT}
  poll-interval: ${BINANCE_POLL_INTERVAL:PT30S}