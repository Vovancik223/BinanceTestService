spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/binance_prices_test
    username: postgres
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

binance:
  base-url: http://localhost:8081
  symbol: BNBUSDT
  poll-interval: PT24H